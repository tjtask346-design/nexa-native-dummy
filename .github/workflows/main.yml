name: Build Nexa Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2 (force, ignore wrapper jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Clear old wrapper cache
        run: rm -rf ~/.gradle/wrapper

      - name: Verify files on GitHub
        run: |
          echo "--- wrapper properties on GitHub ---"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle version that will be used ---"
          gradle --version

      - name: Build Debug APK with Gradle 8.10.2
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
